<!DOCTYPE html>
<html>
<head>
  <title>Bible Study App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Scripture Canvas</h1>
    <p>A shared space for studying scripture together.</p>
  </header>
<main>
  <div id="canvas-viewport">
    <div id="canvas-world"></div>
  </div>
  <div id="toolbar">
    <button id="theme-toggle" title="Switch Theme">🌓</button>
    <button id="add-card-button" title="New Card">🗒️</button>
    <input type="text" id="verse-input" placeholder="e.g. John 3:16">
    <button id="add-verse-button" title="Add Verse">➕</button>
    <button id="open-bible-button" title="Open Bible">📖</button>
    <button id="add-map-button" title="Add Map">🗺️</button>
    <button id="add-observation-button" title="Add Observation Zone">👁️</button>
    <button id="add-interpretation-button" title="Add Interpretation Zone">💡</button>
    <button id="add-application-button" title="Add Application Zone">✅</button>
    <button id="add-board-button" title="New Board">🗂️</button>
    <select id="board-switcher"></select>
    <button id="tool-select" class="tool-button active" title="Select Tool">🖱️</button>
    <button id="tool-highlight" class="tool-button" title="Highlight Tool">🖍️</button>
    <button id="tool-connect" class="tool-button" title="Connect Tool">🔗</button>
  </div>
    <div id="global-hud">
      <h3>Prayer & Questions</h3>
      <ul id="hud-list"></ul>
      <input id="hud-input" placeholder="Type a prayer or question...">
      <button id="add-prayer-button">🙏 Add Prayer</button>
      <button id="add-question-button">❓ Add Question</button>
    </div>
</main>
<script src="script.js"></script>
</body>
</html>
