<!DOCTYPE html>
<html>
<head>
  <title>Bible Study App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Scripture Canvas</h1>
    <p>A shared space for studying scripture together.</p>
  </header>
<main>
  <div id="canvas-viewport">
    <div id="canvas-world"></div>
  </div>
  <div id="toolbar">
    <button id="theme-toggle" class="icon-btn" title="Switch Theme">🌓</button>
    <button id="add-card-button" class="icon-btn" title="New Card">🗒️</button>
    <button id="open-bible-button" class="icon-btn" title="Open Bible">📖</button>
    <button id="add-map-button" class="icon-btn" title="Add Map">🗺️</button>
    <button id="add-observation-button" class="icon-btn" title="Add Observation Zone">👁️</button>
    <button id="add-interpretation-button" class="icon-btn" title="Add Interpretation Zone">💡</button>
    <button id="add-application-button" class="icon-btn" title="Add Application Zone">✅</button>
    <button id="tool-select" class="tool-button icon-btn active" title="Select Tool">🖱️</button>
    <button id="tool-highlight" class="tool-button icon-btn" title="Highlight Tool">🖍️</button>
    <button id="tool-underline" class="tool-button icon-btn" title="Underline Tool" style="text-decoration: underline; font-weight: bold;">U</button>
    <button id="tool-text" class="tool-button icon-btn" title="Text Tool" style="font-weight: bold;">T</button>
    <button id="tool-connect" class="tool-button icon-btn" title="Connect Tool">🔗</button>
    <button id="tool-pen" class="tool-button icon-btn" title="Pen Tool">✏️</button>
    <button id="undo-drawing-button" class="icon-btn" title="Undo Last Line">↩️</button>
    <button id="redo-drawing-button" class="icon-btn" title="Redo Last Line">↪️</button>
  </div>
  <div id="verse-widget">
    <input type="text" id="verse-input" placeholder="e.g. John 3:16">
    <button id="add-verse-button" class="icon-btn" title="Add Verse">➕</button>
  </div>
  <div id="board-widget">
  <select id="board-switcher"></select>
    <button id="rename-board-button" class="icon-btn" title="Rename Board">✏️</button>
    <button id="delete-board-button" class="icon-btn" title="Delete Board">🗑️</button>
    <button id="add-board-button" class="icon-btn" title="New Board">🗂️</button>
  </div>
    <div id="global-hud">
      <h3>Prayer & Questions</h3>
      <ul id="hud-list"></ul>
      <input id="hud-input" placeholder="Type a prayer or question...">
      <button id="add-prayer-button">🙏 Add Prayer</button>
      <button id="add-question-button">❓ Add Question</button>
    </div>
</main>
<script src="script.js"></script>
</body>
</html>
