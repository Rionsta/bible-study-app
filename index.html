<!DOCTYPE html>
<html>
<head>
  <title>Bible Study App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Scripture Canvas</h1>
    <p>A shared space for studying scripture together.</p>
  </header>
 <main>
  <div class="card">
    <h2>Genesis 1:1</h2>
    <p>In the beginning, God created the heavens and the earth.</p>
  </div>
  <div class="card">
    <h2>Psalm 23:1</h2>

  <div class="card">

    <p>For God so loved the world, that he gave his only Son.</p>
  </div>
  <p id="health-display">Health: 100</p>
</main>
<script src="script.js"></script>
</body>
</html>
