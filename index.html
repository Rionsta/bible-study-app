<!DOCTYPE html>
<html>
<head>
  <title>Bible Study App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Scripture Canvas</h1>
    <p>A shared space for studying scripture together.</p>
  </header>
 <main>
  <div id="canvas-viewport">
    <div id="canvas-world">
      <div class="card" id="genesis-card">
        <h2>Genesis 1:1</h2>
        <p>In the beginning, God created the heavens and the earth.</p>
        <textarea class="reflection-note hidden" placeholder="Type your reflection here..."></textarea>
      </div>
      <div class="card" id="psalm-card">
        <h2>Psalm 23:1</h2>
        <p>The Lord is my shepherd; I shall not want.</p>
        <textarea class="reflection-note hidden" placeholder="Type your reflection here..."></textarea>
      </div>
      <div class="card" id="john-card">
        <h2>John 3:16</h2>
        <p>For God so loved the world, that he gave his only Son.</p>
        <textarea class="reflection-note hidden" placeholder="Type your reflection here..."></textarea>
      </div>
    </div>
  </div>

  <p id="health-display">Health: 100</p>
  <button id="damage-button">Take Damage</button>
  <button id="heal-button">Heal</button>
  <button id="reset-button">Reset</button>
  <button id="theme-toggle">Switch Theme</button>
</main>
<script src="script.js"></script>
</body>
</html>
