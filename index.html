<!DOCTYPE html>
<html>
<head>
  <title>Bible Study App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Scripture Canvas</h1>
    <p>A shared space for studying scripture together.</p>
  </header>
<main>
  <div id="canvas-viewport">
    <div id="canvas-world"></div>
  </div>
  <div id="toolbar">
    <button id="theme-toggle">Switch Theme</button>
    <button id="add-card-button">+ New Card</button>
    <input type="text" id="verse-input" placeholder="e.g. John 3:16">
    <button id="add-verse-button">Add Verse</button>
    <button id="open-bible-button">Open Bible</button>
    <button id="add-map-button">Add Map</button>
    <button id="add-observation-button">Add Observation Zone</button>
    <button id="add-interpretation-button">Add Interpretation Zone</button>
    <button id="add-application-button">Add Application Zone</button>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
