<!DOCTYPE html>
<html>
<head>
  <title>Bible Study App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Scripture Canvas</h1>
    <p>A shared space for studying scripture together.</p>
  </header>
 <main>
  <div id="canvas-viewport">
    <div id="canvas-world">
      
    </div>
  </div>
  <button id="theme-toggle">Switch Theme</button>
  <button id="add-card-button">+ New Card</button>
  <input type="text" id="verse-input" placeholder="e.g. John 3:16">
<button id="add-verse-button">Add Verse</button>
</main>
<script src="script.js"></script>
</body>
</html>
